<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — SoFo Solutions</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0a0a0a, #111827, #0f172a);
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      animation: fadeIn 1.2s ease forwards;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #60a5fa;
    }
    p {
      font-size: 18px;
      margin-bottom: 40px;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      font-size: 18px;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
    }
    a:hover {
      background: #1d4ed8;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Thank You</h1>
    <p>
      Your submission has been received.  
      <br><br>
      Someone from the SoFo team will reach out shortly after reviewing your intake.
      <br><br>
      In the meantime, feel free to return to our site.
    </p>
    <a href="https://sofosolutions.tech">Back to Home</a>
  </div>
</body>
</html>
